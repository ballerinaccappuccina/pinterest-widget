<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasta Future — Pinterest</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #faf8f6;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { line-height: 1.5; }
    .board {
      width: 100%;
      max-width: 850px;
      margin: 24px auto 0;
    }
    .instructions {
      margin-top: 24px;
      color: #666;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Future — Pinterest</h1>
    <p>Pasta do Pinterest incorporada em formato de mosaico.</p>

    <div class="board">
      <a
        data-pin-do="embedBoard"
        data-pin-board-width="800"
        data-pin-scale-height="400"
        data-pin-scale-width="120"
        href="https://br.pinterest.com/abakargi/future/">
      </a>
    </div>

    <p class="instructions">
      Este widget precisa de conexão com a internet para carregar os Pins.
      Para usá-lo dentro do Notion, hospede este arquivo em um endereço público
      e incorpore a URL hospedada usando o bloco /embed.
    </p>
  </main>

  <!-- Inclua o script oficial do Pinterest apenas uma vez por página. -->
  <script async defer src="https://assets.pinterest.com/js/pinit.js"></script>
</body>
</html>
